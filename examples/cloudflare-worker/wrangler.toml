name = "cleat-webhook"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The signing secret is a secret, not a [vars] entry:
#
#   npx wrangler secret put CLEAT_WEBHOOK_SECRET
#
# For local `wrangler dev`, put it in a git-ignored .dev.vars file:
#
#   CLEAT_WEBHOOK_SECRET=whsec_your_endpoint_secret
